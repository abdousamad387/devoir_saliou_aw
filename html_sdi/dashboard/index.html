<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord ASEDGE</title>
<!--
  Ce fichier simule le tableau de bord "externe" demandé par l'exercice.
  Dans un vrai projet, on remplace le src de l'iframe (voir index.html, section
  Dashboard) par le lien d'intégration fourni par un outil de BI en ligne
  (Google Looker Studio, Power BI, ArcGIS Dashboards, etc.) après avoir cliqué
  sur "Partager > Intégrer un rapport" dans cet outil.
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background-color: #0b1b30;
    background-image: radial-gradient(circle at top right, #0d2545, #0b1b30 60%);
    color: #f4f7fb;
    padding: 1.2rem 1.5rem;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 1rem;
    color: #4fd8cf;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.9rem;
    margin-bottom: 1.4rem;
  }
  .card {
    background: #10233d;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    text-align: center;
  }
  .card .value {
    font-size: 1.6rem;
    font-weight: 700;
    background: linear-gradient(135deg, #4fd8cf, #1f7ae0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card .label {
    font-size: 0.78rem;
    color: #a9b9cc;
    margin-top: 0.2rem;
  }
  .chart h2 {
    font-size: 0.95rem;
    color: #f4f7fb;
    margin-bottom: 0.7rem;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
    font-size: 0.8rem;
  }
  .bar-row .bar-label {
    width: 150px;
    flex-shrink: 0;
    color: #a9b9cc;
  }
  .bar-track {
    flex: 1;
    background: #060f1e;
    border-radius: 5px;
    overflow: hidden;
    height: 14px;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #1f7ae0, #4fd8cf);
  }
  .bar-pct {
    width: 38px;
    text-align: right;
    color: #f4f7fb;
    font-weight: 600;
  }
</style>
</head>
<body>

  <h1>Activité ASEDGE - Vue d'ensemble</h1>

  <div class="cards">
    <div class="card">
      <div class="value">48</div>
      <div class="label">Projets réalisés</div>
    </div>
    <div class="card">
      <div class="value">32</div>
      <div class="label">Clients accompagnés</div>
    </div>
    <div class="card">
      <div class="value">8</div>
      <div class="label">Régions couvertes</div>
    </div>
    <div class="card">
      <div class="value">96%</div>
      <div class="label">Taux de satisfaction</div>
    </div>
  </div>

  <div class="chart">
    <h2>Répartition des activités</h2>
    <div class="bar-row">
      <div class="bar-label">Géomatique &amp; SIG</div>
      <div class="bar-track"><div class="bar-fill" style="width:40%;"></div></div>
      <div class="bar-pct">40%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Développement Web</div>
      <div class="bar-track"><div class="bar-fill" style="width:35%;"></div></div>
      <div class="bar-pct">35%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Conseil &amp; Formation</div>
      <div class="bar-track"><div class="bar-fill" style="width:25%;"></div></div>
      <div class="bar-pct">25%</div>
    </div>
  </div>

</body>
</html>
